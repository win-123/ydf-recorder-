# ============================================================
# 环境配置示例文件
#
# 使用说明：
#   1. 复制本文件为 env.yaml:  cp config/env.example.yaml config/env.yaml
#   2. 将下面的占位符替换为真实的账号和密码
#   3. 切勿将 env.yaml 提交到 Git 仓库（已在 .gitignore 中忽略）
# ============================================================

environments:
  ydf:
    base_url: http://<your-server-ip>
    sysid: yonbip
    username: "<your-username>"
    password: "<your-password>"
    country: "86"
    tenantid: "-1"
    login_type: normal
    finger: "<your-finger-hash>"
    org_id: "<your-org-id>"
    tenant: <your-tenant-name>
    default_org: "<your-default-org>"
    default_user: <your-default-user>
    fiscal_year: "<your-fiscal-year>"
    users:
      <your-default-user>:
        username: "<your-username>"
        password: "<your-password>"
    endpoints:
      service_tree: /iuap-apcom-workbench/menubar/getAllLight/v3
      service_detail: /iuap-apcom-workbench/service/getServiceInfoWithDetail
      templates: /yondif-ams-be/ytemplate/assign/matchingTemplate
      tenant_information: /iuap-data-common/init/allInformation
      switch_tenant: /
      org_tree: /fbdi-be/fbdi/bas/getOrgTree
      update_default_org: /iuap-apcom-workbench/manager/globalPerference/updateUserDefaultOrg
      user_context: /iuap-apcom-workbench/manager/globalPerference/getUser
