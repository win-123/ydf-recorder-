# 真实回归环境基线（2026-09-02；仅作运行前核对，不参与 DSL 解析）
# tenant: 财政一体化
# user_alias: 15500100112
# default_org: "360000000"
# menu_path: 国库单一账户业务申请
# expected: “开户银行”必须打开弹出参照、选择并确认 621700000001 中信银行，随后 form.assert_values
#   必须读取到页面显示的银行名称“中信银行”；报告同时保留 selected、confirmed 和 close_action。
# data_impact: 用例不保存、不提交，不产生业务单据。
#
# Bug 现象: form.fill 仅把 621700000001 写入输入框就报告成功，没有打开弹出参照，参照 replaceItems
#   和页面联动未执行。
# 原因: runtime 把 props.caninput=1 的弹出参照标量值直接交给文本录入并提前返回。
# 解决: 已声明为弹出参照的字段，即使 caninput=1，标量值也继续走唯一候选选择、确认和回填链路。
# 安全边界: 只验证普通表单弹出参照；不保存、不提交。自由文本录入不再由弹出参照标量值隐式表达。
# run: ./.venv/bin/python -m ydf_browser.cli run --dsl tests/real_cases/account_opening_bank_popup_reference.yaml

suite:
  code: real-regression-account-opening-bank-popup-reference
  name: 国库单一账户-开户银行弹出参照真实回归
  description: 验证可输入弹出参照仍完成候选选择、确认与完整值回填
  tenant: 财政一体化
  default_org: "360000000"
cases:
  - code: account-opening-bank-popup-reference
    name: 开立申请选择开户银行
    user: 15500100112
    steps:
      - action: open_menu
        menu_path: 国库单一账户业务申请

      - component: tree
        operation: select
        target:
          label: 1 国库单一账户

      - component: toolbar
        operation: click
        target:
          label: 开立

      - component: form
        operation: fill
        target:
          fields:
            开户银行: "621700000001"

      - component: form
        operation: assert_values
        target:
          fields:
            开户银行: 中信银行
