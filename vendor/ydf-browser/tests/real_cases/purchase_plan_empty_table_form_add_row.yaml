suite:
  code: real-regression-purchase-plan-empty-table-form-add-row
  name: 采购计划-空表新增打开行编辑表单真实回归
  description: 验证空表新增已点击但未立即增行时以行编辑表单作为完成信号
  tenant: 财政一体化
  default_org: "101001"
cases:
  - code: purchase-plan-empty-table-form-add-row
    name: 计划明细空表新增打开行编辑表单
    user: 15747894789
    tags: [regression]
    steps:
      - action: open_menu
        menu_path: 采购管理>>采购计划>>采购计划编制

      - component: toolbar
        operation: click
        target:
          label: 新增
          sub_label: 采购计划

      - component: form
        operation: fill
        target:
          fields:
            使用虚拟预算: 是
            预算项目:
              first_available: true

      - component: editable_table
        operation: add_row
        target:
          label: 新增
          table: 计划明细
          editor: form
