# 真实回归环境基线（2026-08-28；仅作运行前核对，不参与 DSL 解析）
# tenant: 财政一体化
# user_alias: 15500100121
# default_org: 南昌市局本级
# menu_path: 三级项目管理
# prerequisite: 内部机构“101001 秘书处01”和项目目录“999001 财务二级项目”存在。
# expected: 第 5 步 form.fill 必须失败并报告未找到“编报模板”可选值，不能仅因搜索框保留过滤文本而成功。
# data_impact: 用例不保存、不提交，不产生业务数据。
#
# Bug 现象: 原业务值“预制项目支出编报模板”不存在时仍被 form.fill 报告为成功，但字段实际为空。
# 原因: 单选/树下拉的宽松确认把搜索框过滤文本当成已提交值，键盘兜底因此返回假成功。
# 解决: form.fill 的单选/树下拉必须使用已提交值确认；只有过滤文本、没有已选项时失败关闭。
# 回归值: 使用固定哨兵值，避免环境后来新增同名业务模板使本用例漂移。
# run: ./.venv/bin/python -m ydf_browser.cli run --dsl tests/real_cases/third_level_project_missing_draft_template_choice.yaml --headless --report-file /tmp/third-level-project-missing-draft-template-choice.json

suite:
  code: real-regression-third-level-project-missing-draft-template-choice
  name: 三级项目管理-不存在编报模板失败关闭真实回归
  description: 验证树下拉过滤文本不会被误判为已提交编报模板
  tenant: 财政一体化
  default_org: 南昌市局本级
cases:
  - code: third-level-project-missing-draft-template-choice
    name: 不存在的编报模板在表单录入步骤立即失败
    user: 15500100121
    tags: [regression]
    steps:
      - action: open_menu
        menu_path: 三级项目管理

      - component: tree
        operation: select
        target:
          name: 内部机构
          label: 101001 秘书处01

      - component: tree
        operation: select
        target:
          name: 项目目录
          label: 999001 财务二级项目

      - component: toolbar
        operation: click
        target:
          label: 新增

      - component: form
        operation: fill
        target:
          fields:
            编报模板: YDF_BROWSER_MISSING_DRAFT_TEMPLATE_8c11977e92904ad2b6d6
