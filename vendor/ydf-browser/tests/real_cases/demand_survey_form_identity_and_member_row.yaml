# 真实回归环境基线（2026-08-19；仅作运行前核对，不参与 DSL 解析）
# base_url: https://tv5-ydf.yonyougov.top
# env_name: ydf
# tenant: 财政一体化
# user_alias: 15747894789
# default_org: "101001"
# menu_path: 采购管理>>采购需求>>需求调查登记
# prerequisite: 内部机构“秘书处01”存在；确认调研负责部门后，页面自动生成成员表第 1 行。
# expected: 两个表单字段均 confirmed；不执行 add_row，直接填写“需求调查成员”第 1 行成功。
# data_impact: 用例不保存、不提交；如后续增加保存或提交步骤，可在非生产环境产生业务数据。
#
# 历史错误 1: 填写“调研负责部门”时报“平台精确身份状态不兼容”。
# 原因: YDFTreeModalSelect 的真实输入使用派生 fieldid `<base>_input_search_input`，原模板解析未将其列为该组件的候选身份。
# 解决: 仅为 YDFTreeModalSelect 增加该派生身份；同一逻辑根必须只有一个真实输入，多个输入仍保持失败关闭。
#
# 历史错误 2: 填写视口下方的“相关产业发展情况”时报“平台精确身份状态不兼容”。
# 原因: 控件完全位于视口外时，elementFromPoint 无法命中，运行时曾把这种状态误判为确定不可接收 pointer。
# 解决: 完全离屏时将 pointer 状态记为未知，唯一精确身份可按未验证契约绑定；视口内遮挡或 pointer-events:none 仍判定为不可达。
#
# 历史现象 3: 填完“调研负责部门”后，“需求调查成员”已经出现第 1 行，再执行一次 add_row 会得到两行。
# 原因: 第 1 行由页面业务联动自动生成，不是 ydf-browser 重复点击；DSL 中显式 add_row 按语义还会再新增一行。
# 解决: 只需要一名成员时不要执行 add_row，直接填写 row_number: 1；确需第二行时才显式执行 add_row。
# run: ./.venv/bin/python -m ydf_browser.cli run --dsl tests/real_cases/demand_survey_form_identity_and_member_row.yaml --headless

suite:
  code: real-regression-demand-survey-form-identity-member-row
  name: 需求调查登记-表单身份与成员首行真实回归
  description: 验证树参照身份、离屏文本域以及页面联动生成的成员表首行
  tenant: 财政一体化
  default_org: "101001"
cases:
  - code: demand-survey-form-identity-member-row
    name: 填写调研字段并直接录入页面生成的成员首行
    user: 15747894789
    steps:
      - action: open_menu
        menu_path: 采购管理>>采购需求>>需求调查登记

      - component: toolbar
        operation: click
        target:
          label: 新增

      - component: form
        operation: fill
        target:
          fields:
            调研负责部门: 秘书处01
            相关产业发展情况: UI相当好

      - component: editable_table
        operation: fill_row
        target:
          table: 需求调查成员
          row_number: 1
          fields:
            职务/职称: 自动化回归
