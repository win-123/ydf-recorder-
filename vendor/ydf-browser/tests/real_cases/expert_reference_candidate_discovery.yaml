# 发现回归：用 --case discover-expert-type 或 discover-profession 配合 --ai-observe --explore-reference JSON。
# 回填回归：用 --case select-expert-type --case select-profession 普通运行；不保存、不提交。
suite:
  code: expert-reference-candidate-discovery
  name: 专家库参照候选发现真实回归
  tenant: 财政一体化
  default_org: '101001'
  fiscal_year: '2026'
cases:
- code: discover-expert-type
  name: 专家类别逐层发现
  user: '15001365888'
  steps:
  - action: open_menu
    menu_path: 预算绩效>>专家库>>专家库
  - component: toolbar
    operation: click
    target:
      label: 新增
  - component: form
    operation: fill
    target:
      fields:
        姓名: 参照发现{{random.suffix}}
  - component: action
    operation: click
    target:
      fieldid: 202304131402347532532417886100_expTypeCode_btn
- code: select-expert-type
  name: 专家类别逐层发现与末级回填
  user: '15001365888'
  steps:
  - action: open_menu
    menu_path: 预算绩效>>专家库>>专家库
  - component: toolbar
    operation: click
    target:
      label: 新增
  - component: form
    operation: fill
    target:
      fields:
        姓名: 参照发现{{random.suffix}}
  - component: action
    operation: click
    target:
      fieldid: 202304131402347532532417886100_expTypeCode_btn
  - component: popup_reference
    operation: select
    target:
      title: 专家类别
      value: 0101 法律
  - component: form
    operation: assert_values
    target:
      fields:
        专家类别: 法律
- code: discover-profession
  name: 所学专业多层发现
  user: '15001365888'
  steps:
  - action: open_menu
    menu_path: 预算绩效>>专家库>>专家库
  - component: toolbar
    operation: click
    target:
      label: 新增
  - component: form
    operation: fill
    target:
      fields:
        姓名: 参照发现{{random.suffix}}
  - component: action
    operation: click
    target:
      fieldid: 202304131402347532532417886100_professionCode_btn
- code: select-profession
  name: 所学专业多层发现与末级回填
  user: '15001365888'
  steps:
  - action: open_menu
    menu_path: 预算绩效>>专家库>>专家库
  - component: toolbar
    operation: click
    target:
      label: 新增
  - component: form
    operation: fill
    target:
      fields:
        姓名: 参照发现{{random.suffix}}
  - component: action
    operation: click
    target:
      fieldid: 202304131402347532532417886100_professionCode_btn
  - component: popup_reference
    operation: select
    target:
      title: 所学专业
      value: 010101 马克思主义哲学
  - component: form
    operation: assert_values
    target:
