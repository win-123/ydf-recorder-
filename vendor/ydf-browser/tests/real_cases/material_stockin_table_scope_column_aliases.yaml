# 真实回归环境基线（2026-08-27；仅作运行前核对，不参与 DSL 解析）
# base_url: https://tv5-ydf.yonyougov.top
# tenant: 财政一体化
# user_alias: 15001365888
# default_org: "101001"
# menu_path: 易耗品物资>>入库登记>>入库填报
# expected: “物资信息”作用域解析为 wuzhiList；模板列“入库数量”按运行时表头“数量”完成录入。
# data_impact: 用例不保存、不提交；关闭用例页面后不产生业务单据。
#
# Bug 现象: editable_table.fill_row 在录入前报告“无法唯一确定表格作用域”，并称缺少
# “物资分类、存放仓库、入库数量”；DOM 实际表头为“*物资类型、*存放仓库、*数量”。本最小回归
# 只保留无外部参照依赖的“入库数量→数量”，原始三字段组合由聚焦单测覆盖。
# 根因: 表格作用域已观测 DOM 表头后只比较展示标题，未把同一模板列的业务 label、title、
# dataField 和 displayName 作为列身份别名，导致“物资分类→物资类型”“入库数量→数量”失配。
# 最终修复: 仅在同一模板列候选内匹配上述别名，并继续按当前物理表根实际观测表头校验。
# 失败关闭边界: 不在不同模板列、不同表格 region 或不同物理表根之间借用别名；未声明关联的
# 相似文本仍按缺少必需列失败，多根同时合格仍保持歧义失败。
# run: ./.venv/bin/python -m ydf_browser.cli run --dsl tests/real_cases/material_stockin_table_scope_column_aliases.yaml --headless --report-file /tmp/material-stockin-table-scope-column-aliases.json

suite:
  code: real-regression-material-stockin-table-scope-column-aliases
  name: 易耗品入库-表格作用域列别名真实回归
  description: 验证模板业务列名与运行时短表头不同时仍按同一列身份完成作用域预校验
  tenant: 财政一体化
  default_org: "101001"

cases:
  - code: material-stockin-table-scope-column-aliases
    name: 物资信息表格业务列名匹配运行时短标题
    user: 15001365888
    default_org: "101001"
    steps:
      - action: open_menu
        menu_path: 易耗品物资>>入库登记>>入库填报

      - component: toolbar
        operation: click
        target:
          label: 新增

      - component: form
        operation: fill
        target:
          fields:
            来源方式: 采购
            备注: "A3复印纸{{random.suffix}}"

      - component: editable_table
        operation: add_row
        target:
          table: 物资信息
          label: 新增

      - component: editable_table
        operation: fill_row
        target:
          table: 物资信息
          row_number: -1
          fields:
            入库数量: "1111"
