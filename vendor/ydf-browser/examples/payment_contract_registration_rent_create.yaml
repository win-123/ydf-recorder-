suite:
  code: payment_contract_registration_rent_create
  name: 付款合同登记租赁合同新增
  description: 点击新增动态下拉中的租赁合同，录入必填字段并保存
  tenant: 财政一体化
cases:
  - code: create-rent-contract
    name: 新增租赁合同并保存
    description: 验证运行时动态下拉子按钮和租赁合同保存链路
    user: 默认用户
    default_org: "049002"
    steps:
      - action: open_menu
        menu_path: 合同管理>>付款合同>>付款合同登记

      - component: toolbar
        operation: click
        target:
          label: 新增
          sub_label: 租赁合同

      - component: form
        operation: fill
        target:
          fields:
            合同编号: Codex租赁合同{{random.suffix}}
            合同名称: Codex租赁合同{{random.suffix}}
            首年租金: "100"
            合同总金额: "100"
            甲方名称:
              filter: 测试
              match:
                column: 甲方名称
                equals: 测试
            乙方名称: 北京市大兴区博兴街道市民诉求处置中心（北京市大兴区博兴街道综治中心）

      - component: toolbar
        operation: click
        target:
          label: 保存
