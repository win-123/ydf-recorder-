            项目申报部门: 099 老干部处
            执行项目分类: 909 11133+2026
            项目名称: Codex长稳C20260427020349
            预算模版: 0320 0320预算模板
            项目开始时间: "2026-05-01"
            项目结束时间: "2026-12-31"
            项目负责人: 049004测试新增
            基建项目类型: 2 财政安排的基建项目
            项目总额: "10000"
            项目概述: Codex长稳C20260427020349概述
      - component: toolbar
        operation: click
        target:
          label: 保存
      - component: query
        operation: search
        target:
          conditions:
            - field: 项目名称
              equals: Codex长稳C20260427020349
      - component: table_row_action
